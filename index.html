<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ef" />
    <title>Containerzentrale</title>
  </head>
  <body>
    <div id="root">
      <main style="max-width:720px;margin:12vh auto;padding:32px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#18211e">
        <h1 style="font-size:42px;margin:0 0 18px">Containerzentrale</h1>
        <p id="loading-hint" style="font-size:17px;line-height:1.6;color:#5f6b66">Die Oberfläche wird geladen. Falls dieser Hinweis stehen bleibt, wurde die HTML-Datei direkt geöffnet. Bitte stattdessen <strong>Start Container Center.command</strong> doppelklicken.</p>
      </main>
    </div>
    <script>
      if (navigator.language.toLowerCase().startsWith("en")) {
        document.documentElement.lang = "en";
        document.getElementById("loading-hint").innerHTML = "The interface is loading. If this message remains visible, the HTML file was opened directly. Double-click <strong>Start Container Center.command</strong> instead.";
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
